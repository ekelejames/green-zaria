<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Zaria - Live Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1419;
            color: white;
            overflow: hidden;
        }

        .dashboard {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 380px;
            background: linear-gradient(180deg, #1a1f2e 0%, #16202d 100%);
            padding: 0;
            overflow-y: auto;
            border-right: 1px solid rgba(46, 204, 113, 0.2);
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            padding: 30px 25px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header .subtitle {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1em;
            font-weight: 500;
        }

        .sidebar-content {
            padding: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.1) 0%, rgba(39, 174, 96, 0.05) 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid rgba(46, 204, 113, 0.2);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.2);
        }

        .stat-card .number {
            font-size: 3em;
            font-weight: 800;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
        }

        .stat-card.yellow .number {
            color: #f39c12;
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
        }

        .stat-card.green .number {
            color: #2ecc71;
            text-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
        }

        .stat-card .label {
            color: #95a5a6;
            font-size: 0.95em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section h3 {
            margin-bottom: 15px;
            color: #2ecc71;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border-left: 3px solid;
            transition: all 0.3s;
        }

        .legend-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }

        .legend-item.yellow {
            border-left-color: #f39c12;
        }

        .legend-item.green {
            border-left-color: #2ecc71;
        }

        .legend-icon {
            font-size: 2em;
            margin-right: 15px;
        }

        .legend-text strong {
            display: block;
            margin-bottom: 4px;
            font-size: 1.05em;
        }

        .legend-text span {
            color: #95a5a6;
            font-size: 0.9em;
        }

        .schools-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .school-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid;
            cursor: pointer;
            transition: all 0.3s;
        }

        .school-item:hover {
            transform: translateX(8px);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .school-item.outreached {
            border-left-color: #f39c12;
        }

        .school-item.planted {
            border-left-color: #2ecc71;
        }

        .school-item h4 {
            margin-bottom: 8px;
            color: white;
            font-size: 1.05em;
        }

        .school-item .status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 8px;
        }

        .school-item .status.outreached {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            border: 1px solid #f39c12;
        }

        .school-item .status.planted {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid;
            font-weight: 600;
        }

        .connection-status.connected {
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }

        .connection-status.disconnected {
            border-color: #e74c3c;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }

        .status-dot.disconnected {
            background: #e74c3c;
        }

        @keyframes pulse {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
            }
            50% { 
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 18px 35px;
            border-radius: 50px;
            z-index: 2000;
            display: none;
            animation: slideDown 0.5s ease;
            box-shadow: 0 10px 40px rgba(46, 204, 113, 0.5);
            font-weight: 600;
            font-size: 1.05em;
        }

        .notification.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .debug-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85em;
            max-width: 300px;
            z-index: 999;
        }

        .debug-panel h4 {
            color: #2ecc71;
            margin-bottom: 10px;
        }

        .debug-panel .debug-item {
            margin: 5px 0;
            color: #95a5a6;
        }

        .custom-marker {
            background: none;
            border: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: #2ecc71;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #27ae60;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="header">
                <h1>🌳 Green Zaria</h1>
                <p class="subtitle">Live Tree Planting Dashboard</p>
            </div>

            <div class="sidebar-content">
                <div class="stats-grid">
                    <div class="stat-card yellow">
                        <div class="number" id="outreachedCount">0</div>
                        <div class="label">Outreached</div>
                    </div>
                    <div class="stat-card green">
                        <div class="number" id="plantedCount">0</div>
                        <div class="label">Trees Planted</div>
                    </div>
                </div>

                <div class="section">
                    <h3>📍 Legend</h3>
                    <div class="legend-item yellow">
                        <div class="legend-icon">📍</div>
                        <div class="legend-text">
                            <strong>Yellow Marker</strong>
                            <span>School outreached, awaiting planting</span>
                        </div>
                    </div>
                    <div class="legend-item green">
                        <div class="legend-icon">🌳</div>
                        <div class="legend-text">
                            <strong>Green Marker</strong>
                            <span>Trees planted and verified</span>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h3>🏫 Schools (Latest First)</h3>
                    <div class="schools-list" id="schoolsList"></div>
                </div>
            </div>
        </div>

        <div class="map-container">
            <div class="connection-status disconnected" id="connectionStatus">
                <div class="status-dot disconnected"></div>
                <span>Connecting...</span>
            </div>
            
            <div class="debug-panel" id="debugPanel">
                <h4>🔧 Debug Info</h4>
                <div class="debug-item">API: <span id="debugApi">-</span></div>
                <div class="debug-item">WS: <span id="debugWs">-</span></div>
                <div class="debug-item">Events: <span id="debugEvents">0</span></div>
            </div>
            
            <div id="map"></div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Configuration
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000' 
            : `http://${window.location.hostname}:3000`;
        
        const WS_URL = window.location.hostname === 'localhost'
            ? 'ws://localhost:3001'
            : `ws://${window.location.hostname}:3001`;

        document.getElementById('debugApi').textContent = API_URL;
        document.getElementById('debugWs').textContent = WS_URL;

        console.log('🔧 Configuration:', { API_URL, WS_URL });

        const map = L.map('map').setView([11.0892, 7.7186], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markers = new Map();
        const schools = new Map();
        let eventCount = 0;

        // Create custom colored markers using SVG
        const createColorIcon = (color) => {
            const svgIcon = `
                <svg width="25" height="41" viewBox="0 0 25 41" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0z" 
                          fill="${color}" stroke="#fff" stroke-width="1.5"/>
                    <circle cx="12.5" cy="12.5" r="6" fill="#fff" opacity="0.9"/>
                </svg>
            `;
            return L.divIcon({
                html: svgIcon,
                className: 'custom-marker',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34]
            });
        };

        const yellowIcon = createColorIcon('#f39c12');
        const greenIcon = createColorIcon('#2ecc71');

        function addSchoolToMap(school) {
            const { schoolId, name, coordinates, status, plantingImage } = school;
            
            console.log('📍 Adding school to map:', { schoolId, name, status, coordinates });
            
            if (markers.has(schoolId)) {
                const oldMarker = markers.get(schoolId);
                map.removeLayer(oldMarker);
                console.log('🔄 Updating existing marker');
            }

            const icon = status === 'PLANTED' ? greenIcon : yellowIcon;
            console.log(`Using ${status === 'PLANTED' ? 'GREEN' : 'YELLOW'} icon for ${name}`);
            
            const marker = L.marker([coordinates.lat, coordinates.lng], { icon })
                .addTo(map);

            let popupContent = `
                <div style="min-width: 200px;">
                    <h3 style="margin: 0 0 10px 0; color: #2c3e50;">${name}</h3>
                    <p style="margin: 5px 0;"><strong>Status:</strong> 
                        <span style="color: ${status === 'PLANTED' ? '#2ecc71' : '#f39c12'}">
                            ${status === 'PLANTED' ? '🌳 Trees Planted' : '📍 Outreached'}
                        </span>
                    </p>
                    <p style="margin: 5px 0; font-size: 0.9em; color: #7f8c8d;">
                        Lat: ${coordinates.lat.toFixed(4)}, Lng: ${coordinates.lng.toFixed(4)}
                    </p>
            `;

            if (status === 'PLANTED' && plantingImage) {
                popupContent += `
                    <img src="${API_URL}${plantingImage}" 
                         style="width: 100%; border-radius: 8px; margin-top: 10px;"
                         alt="Tree planting evidence"
                         onerror="this.style.display='none'">
                `;
            }

            popupContent += `</div>`;
            marker.bindPopup(popupContent);

            markers.set(schoolId, marker);
            schools.set(schoolId, school);
            
            updateStats();
            updateSchoolsList();
            
            console.log(`✅ Marker added. Total markers: ${markers.size}`);
        }

        function updateStats() {
            let outreached = 0;
            let planted = 0;

            schools.forEach(school => {
                if (school.status === 'PLANTED') {
                    planted++;
                } else {
                    outreached++;
                }
            });

            document.getElementById('outreachedCount').textContent = outreached;
            document.getElementById('plantedCount').textContent = planted;
            
            console.log(`📊 Stats updated: ${outreached} outreached, ${planted} planted`);
        }

        function updateSchoolsList() {
            const schoolsList = document.getElementById('schoolsList');
            const schoolsArray = Array.from(schools.values()).reverse();

            if (schoolsArray.length === 0) {
                schoolsList.innerHTML = '<p style="color: #95a5a6; text-align: center; padding: 20px;">No schools yet</p>';
                return;
            }

            schoolsList.innerHTML = schoolsArray.map(school => `
                <div class="school-item ${school.status === 'PLANTED' ? 'planted' : 'outreached'}"
                     onclick="focusSchool('${school.schoolId}')">
                    <h4>${school.name}</h4>
                    <span class="status ${school.status === 'PLANTED' ? 'planted' : 'outreached'}">
                        ${school.status === 'PLANTED' ? '🌳 Planted' : '📍 Outreached'}
                    </span>
                </div>
            `).join('');
        }

        function focusSchool(schoolId) {
            const school = schools.get(schoolId);
            const marker = markers.get(schoolId);
            
            if (school && marker) {
                map.setView([school.coordinates.lat, school.coordinates.lng], 16);
                marker.openPopup();
            }
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }

        async function loadSchools() {
            console.log('🔄 Loading initial schools from API...');
            try {
                const response = await fetch(`${API_URL}/api/schools`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const schoolsData = await response.json();
                console.log(`📥 Loaded ${schoolsData.length} schools:`, schoolsData);
                
                schoolsData.forEach(school => {
                    addSchoolToMap(school);
                });
                
                if (schoolsData.length === 0) {
                    console.log('⚠️ No schools in database yet');
                }
            } catch (error) {
                console.error('❌ Failed to load schools:', error);
                showNotification('⚠️ Failed to load initial data');
            }
        }

        let ws;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 10;

        function connectWebSocket() {
            console.log(`🔌 Connecting to WebSocket: ${WS_URL}`);
            
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    console.log('✅ WebSocket connected');
                    reconnectAttempts = 0;
                    updateConnectionStatus(true);
                };

                ws.onmessage = (event) => {
                    eventCount++;
                    document.getElementById('debugEvents').textContent = eventCount;
                    
                    try {
                        const data = JSON.parse(event.data);
                        console.log('📨 Received WebSocket event:', data);

                        const { topic, event: eventData } = data;
                        const { schoolId, name, coordinates, status, imageUrl } = eventData;

                        const school = {
                            schoolId,
                            name,
                            coordinates,
                            status,
                            plantingImage: imageUrl
                        };

                        addSchoolToMap(school);

                        if (topic === 'school-outreach-events') {
                            showNotification(`🎉 New school outreached: ${name}`);
                        } else if (topic === 'school-planting-events') {
                            showNotification(`🌳 Trees planted at ${name}!`);
                        }
                    } catch (error) {
                        console.error('❌ Error parsing WebSocket message:', error);
                    }
                };

                ws.onclose = (event) => {
                    console.log('🔌 WebSocket disconnected:', event.code, event.reason);
                    updateConnectionStatus(false);
                    
                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                        console.log(`⏳ Reconnecting in ${delay}ms (attempt ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
                        setTimeout(connectWebSocket, delay);
                    } else {
                        console.error('❌ Max reconnection attempts reached');
                        showNotification('⚠️ Connection lost. Please refresh the page.');
                    }
                };

                ws.onerror = (error) => {
                    console.error('❌ WebSocket error:', error);
                    updateConnectionStatus(false);
                };
            } catch (error) {
                console.error('❌ Failed to create WebSocket:', error);
                updateConnectionStatus(false);
            }
        }

        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connectionStatus');
            const dotEl = statusEl.querySelector('.status-dot');
            const textEl = statusEl.querySelector('span');

            if (connected) {
                statusEl.classList.add('connected');
                statusEl.classList.remove('disconnected');
                dotEl.classList.add('connected');
                dotEl.classList.remove('disconnected');
                textEl.textContent = '🟢 Live';
            } else {
                statusEl.classList.remove('connected');
                statusEl.classList.add('disconnected');
                dotEl.classList.remove('connected');
                dotEl.classList.add('disconnected');
                textEl.textContent = 'Reconnecting...';
            }
        }

        // Initialize
        console.log('🚀 Initializing Green Zaria Dashboard...');
        loadSchools();
        connectWebSocket();
        
        // Poll for updates every 30 seconds as backup
        setInterval(() => {
            console.log('🔄 Polling for updates...');
            loadSchools();
        }, 30000);
    </script>
</body>
</html>
